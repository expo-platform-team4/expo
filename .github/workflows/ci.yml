name: CI

on:
  pull_request:
    branches: [dev, main, staging]
  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# paths 필터는 넣지 않는다.
# required check 로 지정된 job 이 path 필터로 스킵되면 PR 이 "대기 중" 으로 영원히 막힌다.

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # 스타일을 먼저 돌린다. 컴파일보다 훨씬 빨라 피드백이 빠르다.
      # checkMigrationFilenames 는 아래 Build 의 check 에도 걸리지만, 파일명 하나 때문에
      # 컴파일이 다 끝나기를 기다릴 이유가 없어 여기서 먼저 잡는다.
      - name: Style (spotless + checkstyle + 마이그레이션 파일명)
        run: ./gradlew spotlessCheck checkstyleMain checkstyleTest checkMigrationFilenames

      # 테스트는 아래 backend-test job 이 따로 돌린다.
      - name: Build
        run: ./gradlew build -x test

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: front/.nvmrc # Node 26 에서 Next rewrites 가 깨진다
      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile
      - name: Format check
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build

  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Testcontainers 가 PostgreSQL 컨테이너를 띄운다. ubuntu-latest 러너에는 Docker 가 있다.
      # 스프링 컨텍스트 테스트만 컨테이너를 쓰고, 나머지 단위 테스트는 그대로 돈다.
      - name: Test
        run: ./gradlew test
