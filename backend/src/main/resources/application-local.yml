# 로컬 개발 프로필. PostgreSQL + Flyway.
# 스키마는 Flyway 가 만들고 JPA 는 검증만 한다(validate). 엔티티와 스키마가 어긋나면 기동 시점에 잡힌다.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/expo
    username: expo
    password: expo_local_pw
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true

  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      s3:
        # 로컬 S3 에뮬레이터(Adobe S3Mock, docker-compose.yml 참고)를 가리킨다.
        # 운영에서는 이 endpoint 를 지우면 실제 AWS S3 로 붙는다.
        endpoint: ${AWS_S3_ENDPOINT:http://localhost:9090}
        # 에뮬레이터는 bucket.s3.amazonaws.com 같은 가상 호스트 스타일 주소를 쓰지 않는다.
        # path-style(=/{bucket}/{key})이 아니면 요청이 엉뚱한 호스트로 나간다.
        path-style-access-enabled: true

logging:
  level:
    com.expo: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO

  # 로컬은 사람이 읽는 형식을 쓴다. 운영의 JSON 은 application-prod.yml 참고.
  # [traceId] 자리가 비어 있으면 MdcLoggingFilter 를 타지 않은 로그다(기동 로그 등).
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
