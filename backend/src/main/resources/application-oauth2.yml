# 소셜 로그인(Google / Kakao) 설정 — 별도 프로필로 분리되어 있다.
#
# 왜 분리했나:
#   Spring Security 는 spring.security.oauth2.client.registration.* 키가 하나라도 존재하면
#   OAuth2 클라이언트 자동 설정을 활성화한다. 이때 client-id 가 빈 문자열이면
#   "Client id must not be empty" 로 기동 자체가 실패한다.
#   즉 "키를 못 받았으니 빈 값으로 두자" 가 통하지 않는다.
#   그래서 등록 정보 전체를 이 프로필에 몰아두고, 키를 발급받기 전에는 프로필을 켜지 않는다.
#
# 키 발급 전 (현재):
#   SPRING_PROFILES_ACTIVE=local          -> 앱은 정상 기동, 소셜 로그인 엔드포인트만 없음
#
# 키 발급 후:
#   .env 에 GOOGLE_* / KAKAO_* 를 채우고
#   SPRING_PROFILES_ACTIVE=local,oauth2   -> /oauth2/authorization/{google|kakao} 활성화
#
# 아래 ${VAR} 에 기본값을 두지 않은 것은 의도적이다.
# 프로필만 켜고 키를 안 넣으면 기동 시점에 바로 실패해야 원인을 빨리 찾는다.
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: Kakao
            # 카카오는 client_secret 을 헤더가 아니라 body 로 받는다.
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email

        provider:
          # 카카오는 Spring Security 에 내장 provider 가 없고 표준 OIDC discovery 도
          # 그대로 쓰기 어려워 엔드포인트를 직접 지정한다.
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
