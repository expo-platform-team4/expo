# 테스트 프로필. H2 인메모리.
#
# V1__init_schema.sql 은 PostgreSQL 전용 구문(CREATE EXTENSION, JSONB, EXCLUDE 등)을
# 포함하므로 H2 + Flyway 로는 실행할 수 없다. 테스트에서는 Flyway 를 끄고 JPA 가 엔티티로
# 스키마를 생성한다. 로컬·운영 스키마 정합은 PostgreSQL + Flyway(local 프로필)로 검증한다.
spring:
  datasource:
    url: jdbc:h2:mem:expo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: test
        secret-key: test
      s3:
        enabled: false

app:
  # 테스트 전용 더미 시크릿. 운영 값과 무관하며 커밋되어도 안전하다.
  jwt:
    secret: dGVzdC1vbmx5LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2R1Y3Rpb24=

logging:
  level:
    org.hibernate.SQL: DEBUG
