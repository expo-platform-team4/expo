# 테스트 프로필. Testcontainers 가 띄우는 실제 PostgreSQL 을 쓴다.
#
# datasource 를 여기 적지 않는다. 컨테이너 포트가 매 실행마다 달라져서, 스프링이
# @ServiceConnection 으로 직접 꽂아 준다 (PostgresContainerConfig 참고).
#
# 예전에는 H2 인메모리였다. V1__init_schema.sql 이 PostgreSQL 전용 구문
# (CREATE EXTENSION btree_gist, JSONB, EXCLUDE)을 써서 H2 로는 Flyway 를 돌릴 수 없었고,
# 그래서 Flyway 를 끄고 JPA 가 엔티티로 스키마를 만들게 해 두었다.
#
# 그 구성은 "엔티티와 마이그레이션이 어긋나도 테스트가 통과하는" 상태를 만든다 -
# 검사 대상과 검사 기준이 둘 다 엔티티에서 나오기 때문이다. 실제로 로컬 DB 하나가 두 주 동안
# 마이그레이션과 어긋난 채였는데 어떤 테스트도 잡지 못했다. 그래서 바꿨다.
spring:
  jpa:
    hibernate:
      # 운영과 같은 값이다. Flyway 가 만든 스키마를 엔티티가 전수 대조한다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true

  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: test
        secret-key: test
      s3:
        enabled: false

app:
  # 테스트 전용 더미 시크릿. 운영 값과 무관하며 커밋되어도 안전하다.
  jwt:
    secret: dGVzdC1vbmx5LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2R1Y3Rpb24=

logging:
  level:
    org.hibernate.SQL: DEBUG
