# 테스트 프로필. H2 인메모리.
#
# 주의: local(PostgreSQL)과 같은 Flyway 마이그레이션 SQL 을 H2 가 실행한다.
# MODE=PostgreSQL 로 상당 부분은 흡수되지만 JSONB, 배열 타입, ON CONFLICT 세부 문법 등은
# H2 가 끝까지 따라오지 못한다. 마이그레이션 SQL 은 가급적 표준 문법으로 유지하고,
# PostgreSQL 전용 기능이 꼭 필요해지면 아래 순서로 대응한다.
#   1) db/migration(공통) + db/migration-pg(PostgreSQL 전용)로 locations 분기
#   2) 그래도 지저분해지면 Testcontainers PostgreSQL 로 전환
spring:
  datasource:
    url: jdbc:h2:mem:expo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    clean-disabled: false

  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: test
        secret-key: test
      s3:
        enabled: false

app:
  # 테스트 전용 더미 시크릿. 운영 값과 무관하며 커밋되어도 안전하다.
  jwt:
    secret: dGVzdC1vbmx5LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2R1Y3Rpb24=

logging:
  level:
    org.hibernate.SQL: DEBUG
