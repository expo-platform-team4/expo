# 모든 프로필에 공통으로 적용되는 설정.
# 비밀값은 여기에 리터럴로 적지 않는다. 반드시 ${VAR} 로 참조하고 값은 .env / 환경변수에 둔다.
spring:
  application:
    name: expo
  profiles:
    default: local

  # Spring Boot 4 는 Jackson 3(tools.jackson)을 쓴다.
  # Jackson 2 에서 쓰던 spring.jackson.serialization.write-dates-as-timestamps 는
  # 해당 상수가 SerializationFeature 에서 DateTimeFeature 로 옮겨가 더 이상 바인딩되지 않는다.
  # 게다가 Jackson 3 는 날짜를 기본으로 ISO-8601 문자열로 직렬화하므로 설정 자체가 불필요하다.
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Seoul

  jpa:
    open-in-view: false

  # 파일 업로드 한도. Spring 기본값은 1MB 라 그대로 두면 20MB 짜리 팜플렛이
  # 컨트롤러에 닿기도 전에 거절된다. 용도별 실제 한도는 FilePurpose 가 갖고 있고
  # 여기 값은 그중 가장 큰 것보다 조금 넉넉해야 한다.
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  flyway:
    locations: classpath:db/migration
    # 마이그레이션 경로가 오타 등으로 사라지면 기동을 막는다.
    # V1__init_schema.sql 이 들어오면서 true 로 올렸다.
    fail-on-missing-locations: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  # 프론트로 리다이렉트할 때 사용. Next.js dev 서버 기준.
  front-base-url: ${FRONT_BASE_URL:http://localhost:3000}

  jwt:
    # HS256 기준 최소 32바이트. 운영 값은 절대 커밋하지 않는다.
    secret: ${JWT_SECRET}
    access-token-expire-minutes: ${JWT_ACCESS_EXPIRE_MINUTES:30}
    refresh-token-expire-days: ${JWT_REFRESH_EXPIRE_DAYS:14}

  toss:
    # 키 미발급 상태에서는 토스페이먼츠 개발자센터 문서의 공개 테스트 키를 그대로 쓴다.
    # https://docs.tosspayments.com/reference/using-api/api-keys
    client-key: ${TOSS_CLIENT_KEY:}
    secret-key: ${TOSS_SECRET_KEY:}
    api-base-url: https://api.tosspayments.com

  check-in:
    # 행 잠금 대기 상한(ms). PostgreSQL 기본값은 0(무제한)이라 앞선 트랜잭션이 멈추면
    # 뒤따르는 체크인이 영영 기다린다 (이슈 #74). 로컬 측정 기준 체크인 처리는 중앙값
    # 23ms · 최대 135ms 라 3초는 최악값의 20배다. 넘기면 409 로 "잠시 후 다시" 를 돌려준다.
    lock-timeout-millis: ${CHECK_IN_LOCK_TIMEOUT_MILLIS:3000}

  file:
    # s3     = 객체 저장소에 올린다 (기본). 로컬은 docker-compose 의 S3Mock 을 가리킨다
    # memory = 프로세스 메모리에 담는다. 테스트 전용이며 재기동하면 사라진다
    storage: ${FILE_STORAGE:s3}

  s3:
    bucket: ${AWS_S3_BUCKET:expo-local}

  phone-verification:
    code-expire-minutes: ${PHONE_VERIFICATION_CODE_EXPIRE_MINUTES:3}
    # 같은 번호로 재발송 가능해지기까지의 최소 간격. 이 API 는 로그인 없이 열려 있고
    # SMS 는 건당 과금이라, 제한이 없으면 남의 번호로 무한 발송을 시킬 수 있다.
    resend-cooldown-seconds: ${PHONE_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}

  email-verification:
    # 휴대폰(3분)보다 여유를 둔다. 메일 수신이 SMS보다 느릴 수 있어서다.
    code-expire-minutes: ${EMAIL_VERIFICATION_CODE_EXPIRE_MINUTES:5}

  qr:
    # 발권 티켓 QR 원문의 HMAC 서명 키. JWT_SECRET 과 반드시 다른 값을 쓴다.
    # 이 값을 바꾸면 이미 발권된 티켓의 QR 이 전부 무효가 된다.
    token-secret: ${QR_TOKEN_SECRET}

  sms:
    # logging = 실제로 보내지 않고 로그만 남긴다 (기본, 로컬 개발용)
    # solapi  = 실제 발송. 아래 app.solapi 값이 전부 있어야 하고, 없으면 기동에 실패한다
    provider: ${SMS_PROVIDER:logging}

  solapi:
    # 발신번호는 Solapi 콘솔에 사전 등록·인증된 번호만 쓸 수 있다.
    # provider 가 logging 이면 비어 있어도 된다.
    api-key: ${SOLAPI_SMS_API_PUBLIC_KEY:}
    api-secret: ${SOLAPI_SMS_API_SECRET_KEY:}
    sender-number: ${SOLAPI_SENDER_NUMBER:}
    api-base-url: https://api.solapi.com

  mail:
    # logging = 실제로 보내지 않고 로그만 남긴다 (기본, 로컬 개발용)
    # smtp    = 실제 발송. 아래 app.mail.smtp 값이 전부 있어야 하고, 없으면 기동에 실패한다
    provider: ${MAIL_PROVIDER:logging}

    smtp:
      # Gmail 기준. 앱 비밀번호(App Password)를 써야 한다 — 구글 계정 비밀번호 그대로는 인증이
      # 거부된다. https://myaccount.google.com/apppasswords 에서 발급한다 (2단계 인증 필수).
      # provider 가 logging 이면 비어 있어도 된다.
      host: ${MAIL_SMTP_HOST:smtp.gmail.com}
      port: ${MAIL_SMTP_PORT:587}
      username: ${MAIL_SMTP_USERNAME:}
      password: ${MAIL_SMTP_PASSWORD:}
      from: ${MAIL_FROM:${MAIL_SMTP_USERNAME:}}
