# 운영 프로필.
# 기본값을 두지 않는다. 환경변수가 비어 있으면 기동 시점에 실패하는 편이 낫다.
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    clean-disabled: true

  cloud:
    aws:
      region:
        static: ${AWS_REGION}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}

# 운영에서는 Swagger UI 를 닫는다.
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.expo: INFO

  # Boot 4 내장 구조화 로깅. logstash-logback-encoder 같은 의존성이나
  # logback-spring.xml 이 필요 없다. 수집기가 필드로 파싱해야 traceId 검색이 된다.
  #
  # 컨테이너 배포라 stdout 으로만 내보낸다. 파일 롤링을 설정하지 않는다 —
  # 컨테이너 안에 쌓으면 재시작할 때 사라지고, 볼륨을 붙이면 디스크가 찬다.
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        environment: prod
