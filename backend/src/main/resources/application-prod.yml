# 운영 프로필.
# 기본값을 두지 않는다. 환경변수가 비어 있으면 기동 시점에 실패하는 편이 낫다.
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    clean-disabled: true

  cloud:
    aws:
      region:
        static: ${AWS_REGION}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      s3:
        # 이 설정이 없으면 실제 AWS S3(s3.<region>.amazonaws.com)로 붙는다.
        # OCI 배포는 같은 네트워크의 s3mock 컨테이너를 쓰므로 반드시 지정해야 한다.
        #   AWS_S3_ENDPOINT=http://expo-s3mock:9090
        # 진짜 AWS S3 로 옮길 때는 이 두 줄을 지운다 (엔드포인트를 비우는 것이 아니라).
        endpoint: ${AWS_S3_ENDPOINT}
        # 에뮬레이터는 bucket.s3.amazonaws.com 같은 가상 호스트 주소를 쓰지 않는다.
        # path-style(=/{bucket}/{key}) 이 아니면 요청이 엉뚱한 호스트로 나간다.
        path-style-access-enabled: ${AWS_S3_PATH_STYLE:true}

# 운영에서는 Swagger UI 를 닫는다.
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.expo: INFO

  # Boot 4 내장 구조화 로깅. logstash-logback-encoder 같은 의존성이나
  # logback-spring.xml 이 필요 없다. 수집기가 필드로 파싱해야 traceId 검색이 된다.
  #
  # 컨테이너 배포라 stdout 으로만 내보낸다. 파일 롤링을 설정하지 않는다 —
  # 컨테이너 안에 쌓으면 재시작할 때 사라지고, 볼륨을 붙이면 디스크가 찬다.
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        environment: prod
