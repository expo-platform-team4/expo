plugins {
	id 'java'
	id 'checkstyle'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.9.0'
}

group = 'com.expo'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudAwsVersion', '4.1.0')
	set('mybatisStarterVersion', '4.0.1')
	set('springdocVersion', '3.1.0')
	set('jjwtVersion', '0.13.0')
	set('springDotenvVersion', '5.1.0')
}

dependencyManagement {
	imports {
		mavenBom "io.awspring.cloud:spring-cloud-aws-dependencies:${springCloudAwsVersion}"
	}
}

dependencies {
	// --- Web / API ---
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// --- Persistence ---
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation "org.mybatis.spring.boot:mybatis-spring-boot-starter:${mybatisStarterVersion}"
	// Boot 4 는 자동설정이 기술별 모듈로 쪼개져 있다. flyway-core 만 넣으면
	// 의존성은 해석되지만 자동설정이 없어 마이그레이션이 조용히 실행되지 않는다.
	// 반드시 starter 를 써야 한다. (flyway-core 는 starter 가 끌고 온다)
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	// PostgreSQL 은 별도 방언 모듈이 필요하다 (Flyway 10+ 에서 분리됨).
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	// --- Security / Auth ---
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

	// --- Notification / Email ---
	// 비밀번호 재설정 메일 발송용. spring.mail.host 가 없으면 자동설정이 빈을 만들지 않으므로
	// app.mail.provider=logging(기본) 상태에서는 이 스타터가 있어도 실제 연결을 시도하지 않는다.
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// --- Object Storage (S3) ---
	// 이건 AWS SDK 연동 라이브러리일 뿐이다. S3 에뮬레이터는 애플리케이션이 아니라
	// docker-compose.yml 에 별도 서버(Adobe S3Mock)로 떠 있고, 여기서는 그저
	// application-local.yml 의 endpoint 로 HTTP 를 쏠 뿐이다.
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'

	// --- Ops ---
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation "me.paulschwarz:springboot4-dotenv:${springDotenvVersion}"

	// --- Dev ---
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// --- Test ---
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// 스프링 컨텍스트를 띄우는 테스트는 실제 PostgreSQL 위에서 돈다.
	// H2 는 V1__init_schema.sql 의 PostgreSQL 전용 구문(CREATE EXTENSION, JSONB, EXCLUDE)을
	// 실행하지 못해 Flyway 를 꺼야 했고, 그러면 JPA 가 엔티티로 스키마를 만들어
	// "엔티티와 마이그레이션이 어긋나도 테스트가 통과하는" 상태가 된다. 그것 때문에 뺐다.
	// 버전은 Boot 4.1.0 의 BOM 이 관리한다 (Testcontainers 2.0.5).
	// 2.x 부터 아티팩트 이름에 testcontainers- 접두어가 붙는다.
	// 1.x 의 org.testcontainers:postgresql 로 적으면 해석되지 않는다.
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'spring.profiles.active', 'test'
}

spotless {
	java {
		target 'src/**/*.java'
		// 버전을 고정하지 않으면 Spotless 를 올릴 때 포맷 결과가 바뀌어 전 파일 diff 가 난다.
		// 1.28.0 은 Spotless 8.9.0 이 현재 해석하는 버전이다.
		googleJavaFormat('1.28.0')
			.aosp()                 // 4칸 들여쓰기 + 100컬럼
			.formatJavadoc(false)   // 한글을 폭 1 로 계산해 Javadoc 을 이상하게 접는 문제 회피
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
		toggleOffOn()               // // spotless:off ~ // spotless:on 으로 부분 예외
	}
	format 'misc', {
		target '*.gradle', '.gitignore', 'src/**/*.yml'
		// Flyway 마이그레이션(.sql)은 절대 대상에 넣지 않는다.
		// 공백 하나만 바뀌어도 체크섬이 달라져 이미 적용된 모든 DB 가 기동에 실패한다.
		// 지금 프로젝트의 .sql 은 전부 db/migration 아래에 있다.
		trimTrailingWhitespace()
		endWithNewline()
	}
}

checkstyle {
	toolVersion = '13.9.0'
	configFile = rootProject.file('config/checkstyle/checkstyle.xml')
	// 실측 결과 현재 경고가 0건이라 0으로 내렸다. 이 값이 500 이면 규칙을 추가해도
	// 아무것도 막지 못한다 — 경고가 곧 게이트여야 규칙에 힘이 생긴다.
	// 새 규칙 때문에 기존 코드가 대량으로 걸리면, 값을 올리지 말고 그 규칙을 먼저 정리한다.
	maxWarnings = 0
	ignoreFailures = false
}

// 로컬에서는 컴파일 전에 자동으로 고쳐 준다. CI 에서는 소스를 고치지 않고 검사만 한다.
// (CI 가 소스를 고치면 커밋되지 않은 위반이 통과해 버려 게이트 의미가 없다)
// GitHub Actions 는 CI=true 를 자동으로 넣어 준다.
def isCi = System.getenv('CI') != null
tasks.named('compileJava') {
	dependsOn(isCi ? 'spotlessCheck' : 'spotlessApply')
}

// 마이그레이션 파일명 게이트.
// 손번호(V1, V2)는 두 사람이 같은 번호를 만들면 충돌한다. 파일을 만든 시각을 버전으로 쓰면 겹치지 않는다.
// 문서에 적어 두는 것만으로는 지켜지지 않아서 빌드로 막는다. 규칙 배경은 db/migration/README.md 에 있다.
def migrationDir = file('src/main/resources/db/migration')

// V1 은 규칙 도입(2026-08-07) 이전 파일이다. 이름을 바꾸면 이미 적용된 DB 가 전부 깨지므로 예외로 둔다.
def legacyMigrationNames = ['V1__init_schema.sql']

tasks.register('checkMigrationFilenames') {
	group = 'verification'
	description = '마이그레이션 파일명이 V{연월일시분}__{설명}.sql 규칙을 지키는지 검사한다.'

	doLast {
		// R__ 반복 마이그레이션은 버전이 없으므로 검사 대상이 아니다.
		def violations = (migrationDir.listFiles() ?: [])
				.collect { it.name }
				.findAll { it.endsWith('.sql') }
				.findAll { !it.startsWith('R__') && !legacyMigrationNames.contains(it) }
				.findAll { !(it ==~ /^V\d{12}__[a-z0-9_]+\.sql$/) }
				.sort()

		if (!violations.isEmpty()) {
			def now = new Date().format('yyyyMMddHHmm')
			throw new GradleException("""마이그레이션 파일명이 규칙에 어긋난다: ${violations.join(', ')}

버전 마이그레이션은 V{연월일시분}__{설명}.sql 이다. 지금 만든다면 V${now}__example_change.sql
  - 버전은 12자리 숫자(yyyyMMddHHmm)다. 손번호(V2__)도, 밑줄 접두(V_${now}__)도 쓰지 않는다.
    Flyway 는 버전의 밑줄을 점과 같은 구분자로 보기 때문에 앞에 붙이면 파싱이 실패한다.
  - 설명은 소문자·숫자·밑줄만 쓴다.
  - 반복 마이그레이션(R__*.sql)은 검사 대상이 아니다.

규칙: backend/src/main/resources/db/migration/README.md""")
		}
	}
}

tasks.named('check') {
	dependsOn('checkMigrationFilenames')
}
